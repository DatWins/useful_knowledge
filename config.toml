
baseURL = "https://datwins.github.io/useful_knowledge/"
title = "Useful Knowledge"
theme = "beautifulhugo"
language = "en-us"
enableRobotsTXT = true

[params]
  hometitle = "Useful Knowledge"
  subtitle = "A personal library of useful ideas."
  customCSS = ["css/warm-library.css"]
  mainSections = ["posts"]
  showReadingTime = false
  showShare = false
  showRelatedPosts = true
  socialShare = false

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/page/about/"
  weight = 4
